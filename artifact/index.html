<title>Coach Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#today">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="22" height="22"><path d="M3 12h4l2-5 4 10 2-5h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Coach Console</span>
    </a>
    <div class="rail-group">
      <a class="nav-link" data-nav="today" href="#today"><span class="ico">◉</span><span>Today</span></a>
      <a class="nav-link" data-nav="survivor" href="#s-demo"><span class="ico">◐</span><span>Survivor</span></a>
      <a class="nav-link" data-nav="calls" href="#calls"><span class="ico">☏</span><span>Calls</span></a>
      <a class="nav-link" data-nav="patient" href="#patient-demo"><span class="ico">▢</span><span>Survivor app</span></a>
    </div>
    <div class="rail-group rail-later">
      <p class="rail-label">Later</p>
      <a class="nav-link" data-nav="care" href="#care"><span class="ico">△</span><span>Care team risk</span><span class="soon">C1</span></a>
      <a class="nav-link" data-nav="research" href="#research"><span class="ico">⬡</span><span>Research</span><span class="soon">C6·C7</span></a>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <span class="pill-synthetic" title="Every record comes from the hackathon's made-up datasets">Synthetic demo data</span>
      <span class="asof" id="asof"></span>
      <label class="state-switch">Preview state
        <select id="state-select">
          <option value="ready">Ready</option>
          <option value="loading">Loading</option>
          <option value="empty">Empty</option>
          <option value="error">Error</option>
        </select>
      </label>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden></div>
<script src="mock-data.js"></script>
<script src="app.js"></script>
